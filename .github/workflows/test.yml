name: Test and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Prevent duplicate workflow runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict permissions at workflow level (principle of least privilege)
permissions:
  contents: read

env:
  XCODE_VERSION: "26"

jobs:
  test:
    name: Test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Setup code signing
        id: signing
        uses: ./.github/actions/setup-signing
        with:
          development-certificate: ${{ secrets.DEVELOPMENT_CERTIFICATE_DATA }}
          development-passphrase: ${{ secrets.DEVELOPMENT_CERTIFICATE_PASSPHRASE }}
          application-certificate: ${{ secrets.APPLICATION_CERTIFICATE_DATA }}
          application-passphrase: ${{ secrets.APPLICATION_CERTIFICATE_PASSPHRASE }}

      - name: Run tests
        run: make test XCODEBUILD_FLAGS="$XCODEBUILD_FLAGS"
        env:
          XCODEBUILD_FLAGS: ${{ steps.signing.outputs.signing-available == 'true' && '' || 'CODE_SIGNING_ALLOWED=NO' }}

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

  build:
    name: Build Native
    runs-on: macos-latest
    needs: test
    # Archiving and exporting require certificates, which forks never get.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Setup code signing
        uses: ./.github/actions/setup-signing
        with:
          development-certificate: ${{ secrets.DEVELOPMENT_CERTIFICATE_DATA }}
          development-passphrase: ${{ secrets.DEVELOPMENT_CERTIFICATE_PASSPHRASE }}
          application-certificate: ${{ secrets.APPLICATION_CERTIFICATE_DATA }}
          application-passphrase: ${{ secrets.APPLICATION_CERTIFICATE_PASSPHRASE }}

      - name: Build debug archive
        run: set -o pipefail && make archive-debug 2>&1 | mint run xcbeautify

      - name: Compress app
        run: ditto -c -k --keepParent "Export/Pareto Security.app" ParetoSecurity.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ParetoSecurity.app
          path: ParetoSecurity.app.zip
          retention-days: 14

      - name: Publish build hashes
        uses: ./.github/actions/publish-hashes
        with:
          title: Debug Build
          binary: Export/Pareto Security.app/Contents/MacOS/Pareto Security

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

  build-setapp:
    name: Build SetApp
    runs-on: macos-latest
    needs: test
    # Archiving and exporting require certificates, which forks never get.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Setup code signing
        uses: ./.github/actions/setup-signing
        with:
          development-certificate: ${{ secrets.DEVELOPMENT_CERTIFICATE_DATA }}
          development-passphrase: ${{ secrets.DEVELOPMENT_CERTIFICATE_PASSPHRASE }}
          application-certificate: ${{ secrets.APPLICATION_CERTIFICATE_DATA }}
          application-passphrase: ${{ secrets.APPLICATION_CERTIFICATE_PASSPHRASE }}

      - name: Build debug archive
        run: set -o pipefail && make archive-debug-setapp 2>&1 | mint run xcbeautify

      - name: Compress app
        run: ditto -c -k --keepParent "SetAppExport/Pareto Security.app" ParetoSecuritySetApp.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ParetoSecuritySetApp.app
          path: ParetoSecuritySetApp.app.zip
          retention-days: 14

      - name: Publish build hashes
        uses: ./.github/actions/publish-hashes
        with:
          title: SetApp Build
          binary: SetAppExport/Pareto Security.app/Contents/MacOS/Pareto Security SetApp

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
