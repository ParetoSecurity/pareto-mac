name: Claude
on:
  issue_comment:
    types: [created]
permissions:
  actions: read
  contents: read
  id-token: write
  issues: read
  pull-requests: write
jobs:
  review:
    environment: claude
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: anthropics/claude-code-action@v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
