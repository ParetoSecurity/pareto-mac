disabled_rules: # rule identifiers turned on by default to exclude from running
  - identifier_name
  - line_length
  - weak_delegate
  - force_cast
  - nesting
  - force_try
  - function_body_length
  - type_body_length
  - switch_case_alignment
  - cyclomatic_complexity
  - file_length
  - large_tuple
  # Prefers failable String(bytes:encoding:), which changes behaviour
  - optional_data_string_conversion
  # Conflict with SwiftFormat
  - trailing_comma
  - opening_brace

excluded:
  - SourcePackages
  - build
  - Export
  - SetAppExport
  - DerivedData
  - libSetapp
  - app.xcarchive
  - test.xcresult
